name: D1 candidate verification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/d1-preview-verification.yml'
      - 'lib/app-data/**'
      - '__tests__/lib/app-data-preview-*.test.ts'
      - 'app/api/test-app-data/**'
      - 'app/api/itineraries/[id]/ai-backgrounds/route.ts'
      - 'app/api/itineraries/[id]/story/persist/route.ts'
      - 'app/api/itineraries/[id]/story/media/**'
      - 'app/api/subscription/status/route.ts'
      - 'app/api/subscription/webhook/route.ts'
      - 'app/api/cron/cleanup-stories/route.ts'
      - 'app/api/conversations/route.ts'
      - 'migrations/app-preview/**'
      - 'middleware.ts'
      - '__tests__/api/test-app-data-*.test.ts'
      - '__tests__/api/ai-backgrounds-candidate-route.test.ts'
      - '__tests__/api/story-persist-candidate-route.test.ts'
      - '__tests__/api/story-media-candidate-route.test.ts'
      - '__tests__/api/subscription-status-candidate-route.test.ts'
      - '__tests__/api/subscription-webhook-candidate-route.test.ts'
      - '__tests__/api/cleanup-stories-candidate-route.test.ts'
      - '__tests__/api/conversations-candidate-route.test.ts'
      - 'scripts/d1-migration/**'
      - 'wrangler.jsonc'
      - 'docs/CLOUDFLARE_D1_PROJECT.md'
  push:
    branches: [feature/opennext-d1-preview]

permissions:
  contents: read

concurrency:
  group: localley-d1-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_TELEMETRY_DISABLED: '1'
      HEAVY_LOCK_WAIT_SECONDS: '1200'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: |
          /home/dev/projects/CyberLink/shared/scripts/run-heavy.sh bash -lc '
            set -e
            npm ci
            npx vitest run __tests__/lib/app-data-preview-conversations.test.ts __tests__/lib/app-data-preview-db.test.ts __tests__/lib/app-data-preview-story-metadata.test.ts __tests__/lib/app-data-preview-story-slides.test.ts __tests__/lib/app-data-preview-story-media.test.ts __tests__/lib/app-data-preview-story-cleanup.test.ts __tests__/lib/app-data-preview-story-tier.test.ts __tests__/lib/app-data-preview-billing-status.test.ts __tests__/lib/app-data-preview-stripe-events.test.ts __tests__/api/test-app-data-route.test.ts __tests__/api/test-app-data-spots-route.test.ts __tests__/api/test-app-data-stories-route.test.ts __tests__/api/ai-backgrounds-candidate-route.test.ts __tests__/api/story-persist-candidate-route.test.ts __tests__/api/story-media-candidate-route.test.ts __tests__/api/cleanup-stories-candidate-route.test.ts __tests__/api/conversations-candidate-route.test.ts __tests__/api/subscription-status-candidate-route.test.ts __tests__/api/subscription-webhook-candidate-route.test.ts --maxWorkers=1
            node --test scripts/d1-migration/owner-rehearsal.test.mjs
            npx tsc --noEmit
            npx eslint lib/app-data/preview-conversations.ts lib/app-data/preview-db.ts lib/app-data/preview-story-metadata.ts lib/app-data/preview-story-slides.ts lib/app-data/preview-story-media.ts lib/app-data/preview-story-cleanup.ts lib/app-data/preview-story-tier.ts lib/app-data/preview-billing-status.ts lib/app-data/preview-stripe-events.ts lib/app-data/preview-story-candidate.ts __tests__/lib/app-data-preview-conversations.test.ts __tests__/lib/app-data-preview-db.test.ts __tests__/lib/app-data-preview-story-metadata.test.ts __tests__/lib/app-data-preview-story-slides.test.ts __tests__/lib/app-data-preview-story-media.test.ts __tests__/lib/app-data-preview-story-cleanup.test.ts __tests__/lib/app-data-preview-story-tier.test.ts __tests__/lib/app-data-preview-billing-status.test.ts __tests__/lib/app-data-preview-stripe-events.test.ts app/api/test-app-data/route.ts app/api/test-app-data/spots/route.ts "app/api/test-app-data/stories/[id]/route.ts" "app/api/itineraries/[id]/ai-backgrounds/route.ts" "app/api/itineraries/[id]/story/persist/route.ts" "app/api/itineraries/[id]/story/media/[generation]/[slide]/route.ts" app/api/cron/cleanup-stories/route.ts app/api/conversations/route.ts app/api/subscription/status/route.ts app/api/subscription/webhook/route.ts middleware.ts __tests__/api/test-app-data-route.test.ts __tests__/api/test-app-data-spots-route.test.ts __tests__/api/test-app-data-stories-route.test.ts __tests__/api/ai-backgrounds-candidate-route.test.ts __tests__/api/story-persist-candidate-route.test.ts __tests__/api/story-media-candidate-route.test.ts __tests__/api/cleanup-stories-candidate-route.test.ts __tests__/api/conversations-candidate-route.test.ts __tests__/api/subscription-status-candidate-route.test.ts __tests__/api/subscription-webhook-candidate-route.test.ts
          '
