permissions:
  contents: read

concurrency:
  group: localley-d1-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: [ci-1]  # build/test only, no secrets: ci-1 CI server (2026-10-22)
    timeout-minutes: 85  # up to 60 min heavy admission + verification time
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_TELEMETRY_DISABLED: '1'
      HEAVY_LOCK_WAIT_SECONDS: '3600'
    steps:
      - uses: actions/checkout@v4
      - name: Verify public cache evidence acceptance
        run: python3 -B scripts/test_public_cache_proof.py
      - name: Test CI archive provenance and retention
        run: python3 -B scripts/test_ci_archive.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check route review evidence contract
        run: node --test scripts/check-route-review.test.mjs
      - name: Check public planner sample projection
        run: node --test scripts/public-catalog-preview.checks.mjs
      - name: Community moderation job checks
        run: node --test scripts/community-moderation.checks.mjs
      - name: Viral scout checks
        run: node --test scripts/viral-scout.checks.mjs

      - name: Verify single-table count preflight
        run: node --test scripts/d1-migration/count-preflight.checks.mjs
      - name: Check the heavy test list against the paths filter
        run: node --test scripts/ci/heavy-verify.test.mjs
      - name: Heavy checks (vitest, eslint, tsc, node lane in parallel inside one slot)
        run: /home/dev/projects/CyberLink/shared/scripts/run-heavy.sh scripts/ci/heavy-verify.sh
      - name: Clean only this job's quota proof container
        if: always()
        run: node scripts/d1-migration/atomic-usage-proof.mjs --cleanup-only
      - name: Clean only this job's affiliate proof container
        if: always()
        run: node scripts/d1-migration/affiliate-policy-proof.mjs --cleanup-only
      - name: Clean only this job's Source owner proof container
        if: always()
        run: |
          node scripts/d1-migration/source-owner-policy-proof.mjs --cleanup-only
          node scripts/d1-migration/anonymous-read-postgres-proof.mjs --cleanup-only
      - name: Retain proof reports on the CI server
        # No GitHub artifact storage (Actions budget USD 0, advisor 2026-10-31): ci-1 keeps
        # codex-work/localley-artifacts/<run>-<attempt>-<commit>/proof.{tgz,json}, max 20 runs.
        if: always()
        run: python3 -B scripts/ci_archive.py proof
