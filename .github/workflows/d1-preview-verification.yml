        run: node scripts/d1-migration/affiliate-policy-proof.mjs --cleanup-only
      - name: Retain affiliate policy proof report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localley-affiliate-policy-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/localley-affiliate-policy-proof-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: warn
          retention-days: 7

