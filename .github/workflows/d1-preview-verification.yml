permissions:
  contents: read

concurrency:
  group: localley-d1-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_TELEMETRY_DISABLED: '1'
      HEAVY_LOCK_WAIT_SECONDS: '1200'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: |
          /home/dev/projects/CyberLink/shared/scripts/run-heavy.sh bash -lc '
            set -e
            npm ci
            npx vitest run __tests__/lib/auth-notification-store.test.ts --maxWorkers=1
            npx eslint lib/notifications/auth-store.ts lib/notifications/validation.ts __tests__/lib/auth-notification-store.test.ts
            npx vitest run __tests__/api/auth-notification-routes.test.ts __tests__/hooks/auth-notification-ownership.test.tsx --maxWorkers=1
            npx eslint lib/notifications/auth-http.ts lib/auth/client.ts __tests__/api/auth-notification-routes.test.ts __tests__/hooks/auth-notification-ownership.test.tsx
            node scripts/d1-migration/source-owner-policy-proof.mjs --out "$RUNNER_TEMP/localley-source-owner-proof-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
            npx vitest run __tests__/api/source-owner-readers.test.ts __tests__/lib/source-lifetime-authority.test.ts --maxWorkers=1
            npx eslint scripts/d1-migration/source-owner-policy-guard.mjs scripts/d1-migration/source-owner-policy-proof.mjs scripts/d1-migration/source-owner-saved-policy.mjs __tests__/api/source-owner-readers.test.ts __tests__/api/source-owner-postgres.test.ts lib/source-itinerary-access.ts
            npx eslint scripts/d1-migration/affiliate-policy-guard.mjs scripts/d1-migration/affiliate-policy-proof.mjs
            node scripts/d1-migration/affiliate-policy-proof.mjs --out "$RUNNER_TEMP/localley-affiliate-policy-proof-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
            node scripts/d1-migration/atomic-usage-proof.mjs --out "$RUNNER_TEMP/localley-quota-proof-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
            npx vitest run __tests__/lib/usage-tracking-atomic.test.ts --maxWorkers=1
            npx eslint scripts/d1-migration/atomic-usage-proof.mjs lib/usage-tracking.ts __tests__/lib/usage-tracking-atomic.test.ts
            npx vitest run __tests__/lib/stripe-live-session.test.ts __tests__/api/subscription-checkout-live.test.ts __tests__/api/subscription-webhook-live.test.ts __tests__/lib/stripe-customer-ownership.test.ts __tests__/lib/stripe-webhook-crypto.test.ts __tests__/components/preview-save-spot-button.test.tsx __tests__/lib/saved-spot-candidate-url.test.ts __tests__/lib/preview-saved-spot-actor.test.ts __tests__/components/preview-chat-composer.test.tsx --maxWorkers=1
            npx eslint __tests__/lib/stripe-live-session.test.ts __tests__/api/subscription-webhook-live.test.ts lib/stripe.ts app/api/subscription/checkout/route.ts app/api/subscription/webhook/route.ts app/api/connect/webhook/route.ts __tests__/api/subscription-checkout-live.test.ts __tests__/lib/stripe-customer-ownership.test.ts __tests__/lib/stripe-webhook-crypto.test.ts
            npx eslint components/spots/preview-save-spot-button.tsx lib/app-data/preview-saved-spot-actor.ts lib/app-data/saved-spot-candidate-url.ts __tests__/components/preview-save-spot-button.test.tsx __tests__/lib/preview-saved-spot-actor.test.ts __tests__/lib/saved-spot-candidate-url.test.ts
            npx eslint components/chat/preview-chat-composer.tsx lib/app-data/preview-actor.ts __tests__/components/preview-chat-composer.test.tsx
            npx vitest run __tests__/lib/app-data-preview-chat-history-page.test.ts __tests__/pages/chat-history-candidate.test.tsx --maxWorkers=1
            npx eslint app/chat/page.tsx components/chat/source-chat-page.tsx components/chat/preview-chat-history.tsx lib/app-data/preview-chat-history-page.ts __tests__/lib/app-data-preview-chat-history-page.test.ts __tests__/pages/chat-history-candidate.test.tsx
            npx vitest run __tests__/api/chat-candidate-route.test.ts __tests__/api/chat-route-provider.test.ts __tests__/lib/app-data-preview-chat-request.test.ts __tests__/lib/app-data-preview-chat-spots.test.ts __tests__/lib/app-data-preview-chat-usage.test.ts --maxWorkers=1
            npx eslint app/api/chat/route.ts lib/app-data/preview-chat-request.ts __tests__/api/chat-candidate-route.test.ts __tests__/lib/app-data-preview-chat-request.test.ts
            npx vitest run __tests__/lib/app-data-preview-itinerary-editor.test.ts __tests__/app/itinerary-edit-candidate-page.test.tsx __tests__/components/itinerary-edit-candidate-form.test.tsx --maxWorkers=1
