    branches: [feature/opennext-d1-preview]

permissions:
  contents: read

concurrency:
  group: localley-d1-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_TELEMETRY_DISABLED: '1'
      HEAVY_LOCK_WAIT_SECONDS: '1200'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: |
          /home/dev/projects/CyberLink/shared/scripts/run-heavy.sh bash -lc '
            set -e
            npm ci
            npx vitest run __tests__/api/itinerary-private-diagnostics.test.ts __tests__/api/itinerary-provider-fallback.test.ts __tests__/api/itinerary-sanitize.test.ts --maxWorkers=1
            npx eslint app/api/itineraries/generate/diagnostics.ts app/api/itineraries/generate/provider-fallback.ts app/api/itineraries/generate/shared.ts app/api/itineraries/generate/corridor-generation.ts app/api/itineraries/generate/route.ts __tests__/api/itinerary-private-diagnostics.test.ts __tests__/api/itinerary-provider-fallback.test.ts
            npx vitest run __tests__/hooks/use-place-photo.test.tsx --maxWorkers=1
            npx eslint hooks/use-place-photo.ts __tests__/hooks/use-place-photo.test.tsx
            npx vitest run __tests__/app/chat-history-pair.test.tsx --maxWorkers=1
            npx eslint components/chat/chat-interface.tsx __tests__/app/chat-history-pair.test.tsx
            npx vitest run __tests__/components/auth-password-redirect.test.tsx --maxWorkers=1
            npx eslint components/auth/auth-forms.tsx __tests__/components/auth-password-redirect.test.tsx
            npx vitest run __tests__/components/itinerary-activity-card.test.tsx __tests__/api/backfill-photo-coordinate-guard.test.ts --maxWorkers=1
            npx eslint components/activities/itinerary-activity-card.tsx __tests__/components/itinerary-activity-card.test.tsx app/api/admin/spots/backfill-photos/route.ts lib/place-images.ts __tests__/api/backfill-photo-coordinate-guard.test.ts
            node --test scripts/photos/quarantine-source.test.mjs
            node --check scripts/check-production-health.mjs
            node --test scripts/production-health/*.test.mjs
            systemd-analyze --user verify ops/localley-user-health.service ops/localley-user-health.timer
            npx vitest run __tests__/api/notification-preferences-unavailable.test.ts --maxWorkers=1
            npx eslint lib/notifications.ts hooks/use-notifications.ts components/settings/notification-preferences.tsx app/api/notifications/preferences/route.ts __tests__/api/notification-preferences-unavailable.test.ts
            npx vitest run __tests__/lib/auth-user-sync.test.ts __tests__/lib/auth-server.test.ts --maxWorkers=1
            npx eslint lib/auth/user-sync.ts __tests__/lib/auth-user-sync.test.ts
            npx vitest run __tests__/lib/auth-mail.test.ts __tests__/app/itinerary-list-candidate-page.test.tsx __tests__/lib/app-data-preview-itinerary-list.test.ts __tests__/api/itinerary-save-candidate.test.ts __tests__/lib/app-data-preview-itinerary-save.test.ts __tests__/api/itinerary-delete-candidate.test.ts __tests__/lib/app-data-preview-itinerary-delete.test.ts __tests__/api/itinerary-update-candidate.test.ts __tests__/lib/app-data-preview-itinerary-update.test.ts __tests__/api/itinerary-detail-candidate.test.ts __tests__/lib/app-data-preview-itinerary-detail.test.ts __tests__/api/spot-photos.test.ts __tests__/api/spot-photos-candidate.test.ts __tests__/lib/app-data-preview-spot-photos.test.ts __tests__/api/cities-candidate-route.test.ts __tests__/lib/app-data-preview-cities.test.ts __tests__/lib/app-data-preview-saved-spots.test.ts __tests__/lib/app-data-preview-conversations.test.ts __tests__/lib/app-data-preview-db.test.ts __tests__/lib/app-data-preview-story-metadata.test.ts __tests__/lib/app-data-preview-story-slides.test.ts __tests__/lib/app-data-preview-story-media.test.ts __tests__/lib/app-data-preview-story-cleanup.test.ts __tests__/lib/app-data-preview-story-tier.test.ts __tests__/lib/app-data-preview-billing-status.test.ts __tests__/lib/app-data-preview-stripe-events.test.ts __tests__/api/test-app-data-route.test.ts __tests__/api/test-app-data-spots-route.test.ts __tests__/api/test-app-data-stories-route.test.ts __tests__/api/ai-backgrounds-candidate-route.test.ts __tests__/api/story-persist-candidate-route.test.ts __tests__/api/story-media-candidate-route.test.ts __tests__/api/cleanup-stories-candidate-route.test.ts __tests__/api/conversations-candidate-route.test.ts __tests__/api/conversation-messages-candidate-route.test.ts __tests__/api/conversation-patch-candidate-route.test.ts __tests__/api/saved-spots-candidate-route.test.ts __tests__/api/subscription-status-candidate-route.test.ts __tests__/api/subscription-webhook-candidate-route.test.ts 