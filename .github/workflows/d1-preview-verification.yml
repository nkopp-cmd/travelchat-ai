            npx tsc --noEmit
            npx eslint lib/auth/mail.ts lib/auth/server.ts __tests__/lib/auth-mail.test.ts __tests__/app/itinerary-list-candidate-page.test.tsx app/itineraries/page.tsx lib/app-data/preview-itinerary-list.ts __tests__/lib/app-data-preview-itinerary-list.test.ts app/api/itineraries/save/route.ts lib/app-data/preview-itinerary-save.ts __tests__/api/itinerary-save-candidate.test.ts __tests__/lib/app-data-preview-itinerary-save.test.ts lib/app-data/preview-itinerary-delete.ts __tests__/api/itinerary-delete-candidate.test.ts __tests__/lib/app-data-preview-itinerary-delete.test.ts "app/api/itineraries/[id]/update/route.ts" lib/app-data/preview-itinerary-update.ts __tests__/api/itinerary-update-candidate.test.ts __tests__/lib/app-data-preview-itinerary-update.test.ts "app/api/itineraries/[id]/route.ts" lib/app-data/preview-itinerary-detail.ts __tests__/api/itinerary-detail-candidate.test.ts __tests__/lib/app-data-preview-itinerary-detail.test.ts app/api/spots/[id]/photos/route.ts lib/app-data/preview-spot-photos.ts __tests__/api/spot-photos.test.ts __tests__/api/spot-photos-candidate.test.ts __tests__/lib/app-data-preview-spot-photos.test.ts scripts/d1-migration/compare-cities.mjs lib/app-data/city-counts.ts scripts/d1-migration/compare-cities.test.mjs lib/app-data/preview-cities.ts app/api/cities/route.ts __tests__/lib/app-data-preview-cities.test.ts __tests__/api/cities-candidate-route.test.ts lib/app-data/preview-saved-spots.ts lib/app-data/preview-conversations.ts lib/app-data/preview-db.ts lib/app-data/preview-story-metadata.ts lib/app-data/preview-story-slides.ts lib/app-data/preview-story-media.ts lib/app-data/preview-story-cleanup.ts lib/app-data/preview-story-tier.ts lib/app-data/preview-billing-status.ts lib/app-data/preview-stripe-events.ts lib/app-data/preview-story-candidate.ts __tests__/lib/app-data-preview-saved-spots.test.ts __tests__/lib/app-data-preview-conversations.test.ts __tests__/lib/app-data-preview-db.test.ts __tests__/lib/app-data-preview-story-me