            npx vitest run __tests__/api/story-mail-cloudflare.test.ts __tests__/lib/story-mail-cloudflare.test.ts __tests__/lib/itinerary-mail-limit.test.ts __tests__/lib/itinerary-mail.test.ts __tests__/lib/auth-mail.test.ts __tests__/api/itinerary-mail-candidate.test.ts __tests__/api/story-mail-candidate.test.ts --maxWorkers=1
