      - name: Clean only this job's quota proof container
        if: always()
        run: node scripts/d1-migration/atomic-usage-proof.mjs --cleanup-only
      - name: Retain quota proof report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localley-quota-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/localley-quota-proof-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: warn
          retention-days: 7

