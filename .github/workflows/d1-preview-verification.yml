            npx vitest run __tests__/api/admin-guides-candidate-route.test.ts __tests__/lib/app-data-preview-admin-guides.test.ts --maxWorkers=1
            npx vitest run __tests__/lib/app-data-preview-chat-spots.test.ts __tests__/api/chat-route-provider.test.ts --maxWorkers=1
