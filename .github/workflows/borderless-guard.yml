name: Borderless guard

# d1-preview-verification.yml runs only for its listed paths, so a new
# decorative border in any other UI file never met the guard. This job runs
# the two border guards and the design-token ratchet for every UI change.
on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'hooks/**'
      - 'providers/**'
      - 'lib/**/*.tsx'
      - 'styles/**'
      - 'tailwind.config.ts'
      - 'scripts/check-borderless.mjs'
      - 'scripts/check-embedded-borders.checks.mjs'
      - 'scripts/check-design-tokens.mjs'
      - 'scripts/check-design-tokens.checks.mjs'
      - 'scripts/design-token-baseline.json'
      - '.github/workflows/borderless-guard.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'hooks/**'
      - 'providers/**'
      - 'lib/**/*.tsx'
      - 'styles/**'
      - 'tailwind.config.ts'
      - 'scripts/check-borderless.mjs'
      - 'scripts/check-embedded-borders.checks.mjs'
      - 'scripts/check-design-tokens.mjs'
      - 'scripts/check-design-tokens.checks.mjs'
      - 'scripts/design-token-baseline.json'
      - '.github/workflows/borderless-guard.yml'

jobs:
  borderless:
    runs-on: [ci-1]  # build/test only, no secrets: ci-1 CI server (2026-10-22)
    timeout-minutes: 70  # up to 60 min heavy admission + guard time
    env:
      HEAVY_LOCK_WAIT_SECONDS: '3600'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject new decorative borders and legacy colours
        run: |
          /home/dev/projects/CyberLink/shared/scripts/run-heavy.sh bash -lc '
            set -e
            npm ci --ignore-scripts
            node scripts/check-borderless.mjs
            node --test scripts/check-embedded-borders.checks.mjs
            node scripts/check-design-tokens.mjs
            node --test scripts/check-design-tokens.checks.mjs
          '
